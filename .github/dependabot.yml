version: 2

# One entry per npm package boundary (root workspaces + the three standalone
# packages, each with their own package-lock.json). Updates are grouped so a
# weekly run opens one PR per directory instead of one per dependency (#224).
#
# TypeScript and Electron majors need a deliberate, hand-reviewed pass — the
# packaging/signing surface for Electron, compiler behavior for TypeScript —
# not an automated bump. Electron last moved 31→44 by hand in #1225 (which also
# took electron-builder 24→26); TypeScript's 5→7 jump is still outstanding
# (see #224).
#
# They're excluded from grouping and ignored on major versions so Dependabot
# keeps proposing their minor/patch updates without opening a major-version PR
# that would just sit unmergeable until that follow-up work happens.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "electron"
          - "electron-builder"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      - dependency-name: "electron-builder"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/worker"
    schedule:
      interval: weekly
      day: tuesday
    groups:
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
      day: tuesday
    groups:
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
