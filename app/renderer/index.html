  <meta charset="UTF-8" />

<body class="ai-disabled not-pro rc-active">
<div id="root"></div>


<!-- Settings dialog (#204) — Storage, About. One header gear opens a tabbed
     modal: Storage picks where recordings, stems and captured sessions live
     and shows disk usage (no cap — the figure is informational only; point
     the folder inside an iCloud/Dropbox/Drive folder for sync, that's the
     whole cloud story for MVP). About shows the installed app version.
     Mounted by SettingsPanel.tsx (TD-001 slice 3, #421) via a React portal
     into this static node — see App.tsx. -->
<div id="settings-island"></div>

<!-- Feedback dialog (#144, in-app submission #472) — FeedbackDialog.tsx
     (TD-001 slice 6f, #704) renders it. -->
<div id="feedback-dialog-island"></div>

<!-- Actionable path to grading a real service (#295 rework of #142) —
     GradeOwnGuideDialog.tsx (TD-001 slice 6f, #704) renders it. -->
<div id="guide-dialog-island"></div>

<!-- Doubling/Phase Bug Detector (#370) — PhaseDoublingDialog.tsx (TD-001
     slice 6f, #704) renders it. -->
<div id="phase-doubling-dialog-island"></div>

<!-- Ideal curve editor. User-authored targets are saved in settings.json and
     compared with the same level-invariant PRD 05 scoring as built-ins. Now
     React's CurveEditorDialog (TD-001 slice 6b, #700), portaled onto this
     static island node. -->
<div id="curve-editor-island"></div>

<!-- Rig name / confirm dialog. Electron's renderer has no window.prompt/confirm,
     so Save As…, Rename and Delete drive this small inline modal instead.
     Now RigDialog.tsx (TD-001 slice 6i, #712) renders it reactively from
     rigDialogStore, portaled onto this static island; it keeps the same ids
     (#rig-dialog/-title/-msg/-input/-ok/-cancel) and the window.rigDialog
     promise API so the rig/group prompts are unchanged. -->
<div id="rig-dialog-island"></div>

<!-- License entry/status dialog (#54) — opened from the header badge, the
     Help ▸ License… menu item, and every "Upgrade" link. Validation is fully
     offline (Ed25519 signature in the main process); no network call, ever.
     Mounted by LicensePanel.tsx (TD-001 slice 3, #421) via a React portal
     into this static node — see App.tsx. -->
<div id="license-island"></div>

<script type="module" src="/src/main.tsx"></script>
</body>
</html>
