# XcodeGen spec for the Sound Buddy iOS app — the source of truth for
# SoundBuddy.xcodeproj. After editing this file (or adding/removing files under
# SoundBuddy/), regenerate and commit the result:
#
#   brew install xcodegen
#   cd apps/ios && xcodegen generate
#
# The app target holds only SwiftUI views and the AVAudioEngine adapter; all
# testable logic lives in the local SPM package SoundBuddyKit.
name: SoundBuddy
options:
  bundleIdPrefix: com.soundbuddy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SoundBuddyKit:
    path: SoundBuddyKit
targets:
  SoundBuddy:
    type: application
    platform: iOS
    sources:
      - path: SoundBuddy
    dependencies:
      - package: SoundBuddyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soundbuddy.ios # Mac app is com.soundbuddy.app
        # iPhone first; iPad (2) is a later slice — the views are size-class ready.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: SoundBuddy/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sound Buddy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # No team and no entitlements file: Simulator builds need no signing,
        # and there is deliberately no local-network entitlement while the LAN
        # companion is parked. Pick your own team in Xcode to run on a device.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  SoundBuddy:
    build:
      targets:
        SoundBuddy: all
    test:
      gatherCoverageData: true
      targets:
        - package: SoundBuddyKit/SoundBuddyKitTests
