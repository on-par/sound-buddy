# XcodeGen spec for the Sound Buddy iOS app — the source of truth for
# SoundBuddy.xcodeproj. After editing this file (or adding/removing files under
# SoundBuddy/), regenerate and commit the result:
#
#   brew install xcodegen
#   cd apps/ios && xcodegen generate
#
# The app target holds only SwiftUI views and the AVAudioEngine adapter; all
# testable logic lives in the local SPM package SoundBuddyKit.
name: SoundBuddy
options:
  bundleIdPrefix: com.soundbuddy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SoundBuddyKit:
    path: SoundBuddyKit
targets:
  SoundBuddy:
    type: application
    platform: iOS
    sources:
      - path: SoundBuddy
    dependencies:
      - package: SoundBuddyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soundbuddy.ios # Mac app is com.soundbuddy.app
        # Universal (iPhone + iPad). The layouts are size-based, so iPad, Split
        # View and Stage Manager windows reuse portrait/landscape. iPad-specific
        # layouts are a later slice (#1657).
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: SoundBuddy/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sound Buddy
        # Only OS-provided HTTPS/standard crypto — the same answer as builds 1-10.
        # Without this, every TestFlight upload lands on "Missing Export
        # Compliance" in App Store Connect until someone answers by hand.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # Landscape is RTA-first Analyze (#1548); upside-down stays excluded on iPhone.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # iPad gets all four orientations.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # No team and no entitlements file: Simulator builds need no signing,
        # and there is no multicast entitlement yet (the console link uses
        # unicast only until Apple grants
        # com.apple.developer.networking.multicast). Pick your own team in
        # Xcode to run on a device.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # testflight.sh (#1696) hands the App Store profile to the app target
        # only, through this variable: a command-line
        # PROVISIONING_PROFILE_SPECIFIER would also reach the SoundBuddyKit
        # package targets, which reject provisioning profiles. Empty (no
        # profile) for everyday builds.
        PROVISIONING_PROFILE_SPECIFIER: $(SOUNDBUDDY_PROVISIONING_PROFILE)
schemes:
  SoundBuddy:
    build:
      targets:
        SoundBuddy: all
    test:
      gatherCoverageData: true
      targets:
        - package: SoundBuddyKit/SoundBuddyKitTests
